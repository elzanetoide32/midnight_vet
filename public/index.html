<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DApp Veterinaria - Midnight</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header / Estado de Conexión -->
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-stone-900">🐾 Veterinaria ZK DApp</h1>
                <p class="text-sm text-stone-500">Gestión privada de pacientes sobre Midnight</p>
            </div>
            <div id="wallet-status" class="text-sm font-mono bg-stone-50 px-4 py-2 rounded-xl border border-stone-200 text-stone-600">
                Wallet no conectada
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- FORMULARIO 1: Registrar Mascota -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
                <h2 class="text-lg font-semibold mb-4 text-stone-900">Registrar Nueva Mascota</h2>
                <form id="form-mascota" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-stone-600 mb-1">ID de Mascota</label>
                        <input type="text" id="pet-id" required placeholder="Ej: pet-001" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-sm">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-medium text-stone-600 mb-1">Dirección del Propietario (Dejar en blanco para usar tu wallet)</label>
                        <input type="text" id="owner-address" placeholder="mn_addr_... (opcional)" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-sm font-mono">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-stone-600 mb-1">Nombre</label>
                        <input type="text" id="pet-name" required placeholder="Ej: Firulais" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-sm">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-stone-600 mb-1">Especie (Número)</label>
                            <input type="number" id="pet-species" required value="0" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-stone-600 mb-1">Año de Nacimiento</label>
                            <input type="text" id="pet-birth" required placeholder="2020" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-stone-600 mb-1">Raza</label>
                        <input type="text" id="pet-breed" required placeholder="Ej: Mestizo" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-sm">
                    </div>

                    <button type="submit" class="w-full py-2.5 bg-stone-900 text-white rounded-xl font-medium text-sm hover:bg-stone-800 transition-colors">
                        Registrar Mascota (6 args)
                    </button>
                </form>
            </div>

            <!-- FORMULARIO 2: Agregar Visita -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
                <h2 class="text-lg font-semibold mb-4 text-stone-900">Registrar Visita Médica</h2>
                <form id="form-visita" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-stone-600 mb-1">ID de Mascota Existente</label>
                        <input type="text" id="visit-pet-id" required placeholder="Ej: pet-001" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-stone-600 mb-1">Nota / Diagnóstico</label>
                        <textarea id="visit-note" required rows="4" placeholder="Detalles de la consulta..." class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-sm"></textarea>
                    </div>

                    <button type="submit" class="w-full py-2.5 bg-stone-900 text-white rounded-xl font-medium text-sm hover:bg-stone-800 transition-colors mt-8">
                        Registrar Visita (3 args)
                    </button>
                </form>
            </div>

        </div>

        <!-- Consola de Logs / Resultados -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
            <h3 class="text-sm font-semibold mb-2 text-stone-700">Estado de Transacciones / Logs:</h3>
            <pre id="log-output" class="bg-stone-900 text-stone-100 p-4 rounded-xl text-xs font-mono h-32 overflow-y-auto">Esperando acciones...</pre>
        </div>

    </div>

    <!-- Script del Frontend para conectar con las rutas Express -->
    <script>
        // Simulando la obtención de la wallet local (ajustalo según cómo la cargues en tu app)
        let currentWalletAddress = "mn_addr_mock_doctor_12345"; 
        document.getElementById('wallet-status').innerText = `Wallet: ${currentWalletAddress.substring(0, 10)}...`;

        function log(message) {
            const output = document.getElementById('log-output');
            output.innerText += `\n[${new Date().toLocaleTimeString()}] ${message}`;
            output.scrollTop = output.scrollHeight;
        }

        // Enviar Mascota (6 argumentos en el backend)
        document.getElementById('form-mascota').addEventListener('submit', async (e) => {
            e.preventDefault();
            log('Generando ZK Proof y registrando mascota...');

            const payload = {
                id: document.getElementById('pet-id').value,
                ownerAddress: document.getElementById('owner-address').value,
                nombre: document.getElementById('pet-name').value,
                especie: document.getElementById('pet-species').value,
                raza: document.getElementById('pet-breed').value,
                anioNacimiento: document.getElementById('pet-birth').value,
                walletAddress: currentWalletAddress
            };

            try {
                const res = await fetch('/api/mascotas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if(data.success) {
                    log(`¡Mascota registrada con éxito! TX: ${data.txId}`);
                } else {
                    log(`Error: ${data.error}`);
                }
            } catch (err) {
                log(`Error de red: ${err.message}`);
            }
        });

        // Enviar Visita (3 argumentos en el backend)
        document.getElementById('form-visita').addEventListener('submit', async (e) => {
            e.preventDefault();
            log('Agregando visita médica...');

            const payload = {
                petId: document.getElementById('visit-pet-id').value,
                nota: document.getElementById('visit-note').value,
                walletAddress: currentWalletAddress
            };

            try {
                const res = await fetch('/api/visitas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if(data.success) {
                    log(`¡Visita agregada con éxito! TX: ${data.txId}`);
                } else {
                    log(`Error: ${data.error}`);
                }
            } catch (err) {
                log(`Error de red: ${err.message}`);
            }
        });
    </script>
</body>
</html>
